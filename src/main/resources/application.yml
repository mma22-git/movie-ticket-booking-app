spring:
  application:
    name: movie-ticket-booking

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/moviebooking}
      # Create indexes declared on documents (@Indexed / @CompoundIndex) at startup.
      # We rely on this for the unique (showId, seatId) guarantee on booked seats.
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
